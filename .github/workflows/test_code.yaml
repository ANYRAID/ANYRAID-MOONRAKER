# CI for code style and application tests

name: test-code
on: [push, pull_request]
jobs:
  lint-python-code:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: weibullguy/python-lint-plus@v1.12.0
        with:
          python-root-list: "moonraker scripts"
          virtual-env: "python-lint-plus"
          python-version: "3.10"
          use-flake8: true
          flake8-version: "==6.1.0"
          use-mypy: true
          mypy-version: "==1.5.1"
          extra-flake8-options: "--ignore=E226,E301,E302,E303,W503,W504 --max-line-length=88 --max-doc-length=88"
          extra-mypy-options: "--ignore-missing-imports --follow-imports=silent"
  test-screen-history-association:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install history test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium23
          python -m pip install 'importlib-metadata>=6.7.0,<=9.0.0' 'libnacl==2.1.0'
      - name: Test authoritative history association with isolated SQLite
        env:
          PYTHONPATH: .
        run: python tests/test_screen_history_association.py -v
